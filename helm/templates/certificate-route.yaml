apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oauth-server-tls
spec:
  dnsNames:
    - "*.apps.{{ .Values.clusterDomain }}"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
  secretName: v4-0-config-system-router-certs
  usages:
    - digital signature
    - key encipherment
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-oauth-tls
  namespace: bridge-box-console
spec:
  dnsNames:
    - "*.apps.{{ .Values.clusterDomain }}"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
  secretName: default-ingress-cert
  usages:
    - digital signature
    - key encipherment
