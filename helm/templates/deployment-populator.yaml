apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirurl-populator
  labels:
    app.kubernetes.io/name: redirurl-populator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redirurl-populator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redirurl-populator
    spec:
      # The populator talks only to the remote cluster; it needs no local API
      # access, so do not mount the spoke's ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: populator
          # Replace with your registry/image:tag.
          image: registry.apps.k8s.prod-01.solution.sbt/r4c-development/redirurl-populator:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: redirurl-populator-config
            - secretRef:
                name: redirurl-populator-remote
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
