apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oauth-server.fullname" . }}
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "oauth-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "oauth-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oauth-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: oauth-openshift
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - '-ec'
          args:
            - >
              if [ -s
              /var/config/system/configmaps/v4-0-config-system-trusted-ca-bundle/ca-bundle.crt
              ]; then
                  echo "Copying system trust bundle"
                  cp -f /var/config/system/configmaps/v4-0-config-system-trusted-ca-bundle/ca-bundle.crt /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              fi

              exec oauth-server osinserver \

              --config=/var/config/system/configmaps/v4-0-config-system-cliconfig/v4-0-config-system-cliconfig
              \

              --v=9
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - '25'
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
            - name: metrics
              containerPort: 9393
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: v4-0-config-system-session
              readOnly: true
              mountPath: /var/config/system/secrets/v4-0-config-system-session
            - name: v4-0-config-system-cliconfig
              readOnly: true
              mountPath: /var/config/system/configmaps/v4-0-config-system-cliconfig
            - name: v4-0-config-system-serving-cert
              readOnly: true
              mountPath: /var/config/system/secrets/v4-0-config-system-serving-cert
            - name: v4-0-config-system-service-ca
              readOnly: true
              mountPath: /var/config/system/configmaps/v4-0-config-system-service-ca/service-ca.crt
              subPath: service-ca.crt
            - name: v4-0-config-system-router-certs
              readOnly: true
              mountPath: /var/config/system/secrets/v4-0-config-system-router-certs
            - name: v4-0-config-system-ocp-branding-template
              readOnly: true
              mountPath: /var/config/system/secrets/v4-0-config-system-ocp-branding-template
            - name: v4-0-config-user-template-login
              readOnly: true
              mountPath: /var/config/user/template/secret/v4-0-config-user-template-login
            - name: v4-0-config-user-template-provider-selection
              readOnly: true
              mountPath: /var/config/user/template/secret/v4-0-config-user-template-provider-selection
            - name: v4-0-config-user-template-error
              readOnly: true
              mountPath: /var/config/user/template/secret/v4-0-config-user-template-error
            - name: v4-0-config-system-trusted-ca-bundle
              readOnly: true
              mountPath: /var/config/system/configmaps/v4-0-config-system-trusted-ca-bundle/ca-bundle.crt
              subPath: ca-bundle.crt
            - name: v4-0-config-user-idp-0-bind-password
              readOnly: true
              mountPath: /var/config/user/idp/0/secret/v4-0-config-user-idp-0-bind-password
      volumes:
        - name: v4-0-config-system-session
          secret:
            secretName: v4-0-config-system-session
            defaultMode: 420
        - name: v4-0-config-system-cliconfig
          configMap:
            name: v4-0-config-system-cliconfig
            defaultMode: 420
        - name: v4-0-config-system-serving-cert
          secret:
            secretName: v4-0-config-system-serving-cert
            defaultMode: 420
        - name: v4-0-config-system-service-ca
          configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: service-ca.crt
            defaultMode: 420
        - name: v4-0-config-system-router-certs
          secret:
            secretName: v4-0-config-system-router-certs
            defaultMode: 420
        - name: v4-0-config-system-ocp-branding-template
          secret:
            secretName: v4-0-config-system-ocp-branding-template
            defaultMode: 420
        - name: v4-0-config-user-template-login
          secret:
            secretName: v4-0-config-user-template-login
            defaultMode: 420
            optional: true
        - name: v4-0-config-user-template-provider-selection
          secret:
            secretName: v4-0-config-user-template-provider-selection
            defaultMode: 420
            optional: true
        - name: v4-0-config-user-template-error
          secret:
            secretName: v4-0-config-user-template-error
            defaultMode: 420
            optional: true
        - name: v4-0-config-system-trusted-ca-bundle
          configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca-bundle.crt
            defaultMode: 420
            optional: true
        - name: v4-0-config-user-idp-0-bind-password
          secret:
            secretName: v4-0-config-user-idp-0-bind-password
            items:
              - key: bindPassword
                path: bindPassword
            defaultMode: 420
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: system-cluster-critical
