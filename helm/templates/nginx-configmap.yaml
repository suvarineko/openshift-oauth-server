{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oauth-server.fullname" . }}-nginx-config
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /var/run/nginx.pid;
    error_log /dev/stderr notice;
    events {
        worker_connections 1024;
    }
    http {
        client_body_temp_path /tmp/nginx_client_temp;
        proxy_temp_path /tmp/nginx_proxy_temp;
        fastcgi_temp_path /tmp/nginx_fastcgi_temp;
        uwsgi_temp_path /tmp/nginx_uwsgi_temp;
        scgi_temp_path /tmp/nginx_scgi_temp;
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'upstream_addr="$upstream_addr" upstream_status="$upstream_status"';
        access_log /dev/stdout main;
        upstream oauth_backend {
            server {{ .Values.proxy.upstreams.primary.oauth }}:{{ .Values.proxy.upstreams.primary.port }};
        }

        upstream api_backend {
            server {{ .Values.proxy.upstreams.primary.api }}:{{ .Values.proxy.upstreams.primary.port }};
        }

        server {
            listen {{ .Values.proxy.port }} ssl;
            server_name {{ .Values.proxy.domain }};
            ssl_certificate /etc/tls/tls.crt;
            ssl_certificate_key /etc/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;

            location / {
                proxy_pass https://oauth_backend;
                proxy_ssl_server_name on;
                proxy_set_header Host {{ .Values.proxy.upstreams.primary.oauth }}; 
                # proxy_set_header Upgrade $http_upgrade;
                # proxy_set_header Connection "upgrade";
            }

            location /apis {
                proxy_pass https://api_backend;
                proxy_ssl_server_name on;
                proxy_set_header Host {{ .Values.proxy.upstreams.primary.api }}; 
                # proxy_set_header Upgrade $http_upgrade;
                # proxy_set_header Connection "upgrade";
            }

            location /nginx-health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
