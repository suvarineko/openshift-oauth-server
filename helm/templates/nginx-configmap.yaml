{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oauth-server.fullname" . }}-nginx-config
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /var/run/nginx.pid;
    error_log /dev/stderr notice;
    events {
        worker_connections 1024;
    }
    http {
        resolver 169.254.20.10;
        client_body_temp_path /tmp/nginx_client_temp;
        proxy_temp_path /tmp/nginx_proxy_temp;
        fastcgi_temp_path /tmp/nginx_fastcgi_temp;
        uwsgi_temp_path /tmp/nginx_uwsgi_temp;
        scgi_temp_path /tmp/nginx_scgi_temp;
        log_format main '$remote_addr - $remote_user [$time_local] "$request" ' '$status $body_bytes_sent "$http_referer" ' '"$http_user_agent" "$http_x_forwarded_for" ' 'upstream_addr="$upstream_addr" upstream_status="$upstream_status"';
        access_log /dev/stdout main;

        # Shared memory for health check caching
        lua_shared_dict health_cache 1m;

        #upstream oauth_backend {
        #    server oauth-console1.apps.k8s.prod-01.solution.sbt:443 fail_timeout=15s max_fails=3;
        #    server oauth-console.apps.k8s.osad-testing.solution.sbt:443 backup;
        #}

        #upstream oidc_api_backend {
        #    server dowa.apps.k8s.osad-testing.solution.sbt:443;
        #}

        #upstream oauth_api_backend {
        #    server oauth-apiserver1.apps.k8s.prod-01.solution.sbt:443 fail_timeout=15s max_fails=3;
        #    server oauth-apiserver.apps.k8s.osad-testing.solution.sbt:443 backup;
        #}

        server {
            listen 32443 ssl;
            server_name proxy-auth.apps.k8s.osad-testing.solution.sbt;
            ssl_certificate /etc/tls/tls.crt;
            ssl_certificate_key /etc/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;
            
            # Declare variables for Lua script
            set $chosen_upstream "";
            set $target_path "";
            set $host_header "";
            set $primary_healthy "";
            set $secondary_healthy "";

            location / {
                access_log /dev/stdout main;
                error_log /dev/stderr debug;

                access_by_lua_block {
                    local health_cache = ngx.shared.health_cache
                    local cache_ttl = 30  -- Cache health checks for 30 seconds
                    local now = ngx.time()

                    local primary_oauth_host = "{{ .Values.proxy.upstreams.primary.oauth }}"
                    local primary_api_host = "{{ .Values.proxy.upstreams.primary.api }}"
                    local primary_port = "{{ .Values.proxy.upstreams.primary.port }}"
                    local secondary_oauth_host = "{{ .Values.proxy.upstreams.secondary.oauth }}"
                    local secondary_api_host = "{{ .Values.proxy.upstreams.secondary.api }}"
                    local secondary_port = "{{ .Values.proxy.upstreams.secondary.port }}"

                    local chosen_upstream = ""
                    local chosen_host = ""

                    -- Check cache first
                    local primary_healthy_cached = health_cache:get("primary_healthy")
                    local primary_last_check = health_cache:get("primary_last_check") or 0
                    local cache_age = now - primary_last_check

                    -- Function to perform health check
                    local function check_upstream_health(oauth_host, api_host, port, name)
                        local http = require "resty.http"
                        local httpc = http.new()

                        local oauth_res = httpc:request_uri("https://" .. oauth_host .. ":" .. port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        httpc = http.new()  -- Create new instance for second request
                        local api_res = httpc:request_uri("https://" .. api_host .. ":" .. port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        local oauth_healthy = oauth_res and oauth_res.status == 200 and oauth_res.body and string.match(oauth_res.body, "ok")
                        local api_healthy = api_res and api_res.status == 200 and api_res.body and string.match(api_res.body, "ok")
                        local is_healthy = oauth_healthy and api_healthy

                        ngx.log(ngx.INFO, name .. " health check - OAuth: " .. tostring(oauth_healthy) .. ", API: " .. tostring(api_healthy) .. ", Overall: " .. tostring(is_healthy))
                        return is_healthy
                    end

                    local primary_healthy = false

                    if cache_age >= cache_ttl then
                        -- Cache expired or doesn't exist, perform health check
                        -- Try to acquire lock to prevent multiple simultaneous checks
                        local lock_key = "health_check_lock"
                        local ok, err = health_cache:add(lock_key, 1, 5)  -- 5 second lock

                        if ok then
                            -- We got the lock, perform health check
                            ngx.log(ngx.INFO, "Cache expired (" .. cache_age .. "s), performing health check...")
                            primary_healthy = check_upstream_health(primary_oauth_host, primary_api_host, primary_port, "Primary")

                            -- Update cache
                            health_cache:set("primary_healthy", primary_healthy and 1 or 0, cache_ttl)
                            health_cache:set("primary_last_check", now, cache_ttl)

                            -- If primary is unhealthy, check secondary
                            if not primary_healthy then
                                local secondary_healthy = check_upstream_health(secondary_oauth_host, secondary_api_host, secondary_port, "Secondary")
                                health_cache:set("secondary_healthy", secondary_healthy and 1 or 0, cache_ttl)
                            end

                            health_cache:delete(lock_key)  -- Release lock
                        else
                            -- Another request is checking, use stale cache if available or wait briefly
                            ngx.log(ngx.INFO, "Health check in progress by another request, using cached value")
                            primary_healthy = (primary_healthy_cached == 1)
                        end
                    else
                        -- Cache is fresh, use cached value
                        primary_healthy = (primary_healthy_cached == 1)
                        ngx.log(ngx.DEBUG, "Using cached health status (age: " .. cache_age .. "s) - Primary: " .. tostring(primary_healthy))
                    end

                    -- Choose upstream based on health status
                    if primary_healthy then
                        chosen_upstream = primary_oauth_host .. ":" .. primary_port
                        chosen_host = primary_oauth_host
                        ngx.log(ngx.DEBUG, "Using primary upstream: " .. chosen_upstream)
                    else
                        -- Check secondary health from cache
                        local secondary_healthy_cached = health_cache:get("secondary_healthy")
                        if secondary_healthy_cached == 1 then
                            chosen_upstream = secondary_oauth_host .. ":" .. secondary_port
                            chosen_host = secondary_oauth_host
                            ngx.log(ngx.INFO, "Primary unhealthy, using secondary upstream: " .. chosen_upstream)
                        else
                            -- Both unhealthy, fallback to secondary anyway
                            chosen_upstream = secondary_oauth_host .. ":" .. secondary_port
                            chosen_host = secondary_oauth_host
                            ngx.log(ngx.WARN, "Both upstreams unhealthy, falling back to secondary: " .. chosen_upstream)
                        end
                    end

                    ngx.var.chosen_upstream = chosen_upstream
                    ngx.var.host_header = chosen_host
                }

                proxy_pass https://$chosen_upstream;
                proxy_ssl_server_name on;
                proxy_set_header Host $host_header;

                # Connection and timeout settings
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_send_timeout 30s;
            }

            location /apis {
                access_by_lua_block {
                    local cjson = require "cjson"
                    local health_cache = ngx.shared.health_cache
                    local cache_ttl = 30  -- Cache health checks for 30 seconds
                    local now = ngx.time()

                    local primary_oauth_host = "{{ .Values.proxy.upstreams.primary.oauth }}"
                    local primary_api_host = "{{ .Values.proxy.upstreams.primary.api }}"
                    local primary_port = "{{ .Values.proxy.upstreams.primary.port }}"
                    local secondary_oauth_host = "{{ .Values.proxy.upstreams.secondary.oauth }}"
                    local secondary_api_host = "{{ .Values.proxy.upstreams.secondary.api }}"
                    local secondary_port = "{{ .Values.proxy.upstreams.secondary.port }}"
                    local primary_oidc_host = "{{ .Values.proxy.upstreams.primary.oidc }}"
                    local primary_oidc_port = "{{ .Values.proxy.upstreams.primary.port }}"

                    -- Determine healthy upstream backend using cache
                    local healthy_api_host = ""
                    local healthy_api_port = ""

                    -- Check cache first
                    local primary_healthy_cached = health_cache:get("primary_healthy")
                    local primary_last_check = health_cache:get("primary_last_check") or 0
                    local cache_age = now - primary_last_check

                    -- Function to perform health check
                    local function check_upstream_health(oauth_host, api_host, port, name)
                        local http = require "resty.http"
                        local httpc = http.new()

                        local oauth_res = httpc:request_uri("https://" .. oauth_host .. ":" .. port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        httpc = http.new()  -- Create new instance for second request
                        local api_res = httpc:request_uri("https://" .. api_host .. ":" .. port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        local oauth_healthy = oauth_res and oauth_res.status == 200 and oauth_res.body and string.match(oauth_res.body, "ok")
                        local api_healthy = api_res and api_res.status == 200 and api_res.body and string.match(api_res.body, "ok")
                        local is_healthy = oauth_healthy and api_healthy

                        ngx.log(ngx.INFO, name .. " health check - OAuth: " .. tostring(oauth_healthy) .. ", API: " .. tostring(api_healthy) .. ", Overall: " .. tostring(is_healthy))
                        return is_healthy
                    end

                    local primary_healthy = false

                    if cache_age >= cache_ttl then
                        -- Cache expired or doesn't exist, perform health check
                        -- Try to acquire lock to prevent multiple simultaneous checks
                        local lock_key = "health_check_lock_apis"
                        local ok, err = health_cache:add(lock_key, 1, 5)  -- 5 second lock

                        if ok then
                            -- We got the lock, perform health check
                            ngx.log(ngx.INFO, "Cache expired (" .. cache_age .. "s), performing health check for APIs...")
                            primary_healthy = check_upstream_health(primary_oauth_host, primary_api_host, primary_port, "Primary")

                            -- Update cache
                            health_cache:set("primary_healthy", primary_healthy and 1 or 0, cache_ttl)
                            health_cache:set("primary_last_check", now, cache_ttl)

                            -- If primary is unhealthy, check secondary
                            if not primary_healthy then
                                local secondary_healthy = check_upstream_health(secondary_oauth_host, secondary_api_host, secondary_port, "Secondary")
                                health_cache:set("secondary_healthy", secondary_healthy and 1 or 0, cache_ttl)
                            end

                            health_cache:delete(lock_key)  -- Release lock
                        else
                            -- Another request is checking, use stale cache if available
                            ngx.log(ngx.INFO, "Health check in progress by another request, using cached value")
                            primary_healthy = (primary_healthy_cached == 1)
                        end
                    else
                        -- Cache is fresh, use cached value
                        primary_healthy = (primary_healthy_cached == 1)
                        ngx.log(ngx.DEBUG, "Using cached health status (age: " .. cache_age .. "s) - Primary: " .. tostring(primary_healthy))
                    end

                    -- Determine healthy API host based on cached health status
                    if primary_healthy then
                        healthy_api_host = primary_api_host
                        healthy_api_port = primary_port
                        ngx.log(ngx.DEBUG, "Using primary API: " .. healthy_api_host)
                    else
                        -- Check secondary health from cache
                        local secondary_healthy_cached = health_cache:get("secondary_healthy")
                        if secondary_healthy_cached == 1 then
                            healthy_api_host = secondary_api_host
                            healthy_api_port = secondary_port
                            ngx.log(ngx.INFO, "Primary unhealthy, using secondary API: " .. healthy_api_host)
                        else
                            -- Both unhealthy, fallback to secondary anyway
                            healthy_api_host = secondary_api_host
                            healthy_api_port = secondary_port
                            ngx.log(ngx.WARN, "Both upstreams unhealthy, falling back to secondary API: " .. healthy_api_host)
                        end
                    end

                    -- Now use the original logic with healthy hosts
                    local upstream = "oauth_api_backend"
                    local target_path = ngx.var.uri
                    local host_header = healthy_api_host

                    -- Read request body
                    ngx.req.read_body()
                    local body = ngx.req.get_body_data()

                    if body then
                        local success, json_data = pcall(cjson.decode, body)
                        if success and json_data then
                            -- Check if it's a TokenReview request
                            if json_data.kind == "TokenReview" and
                               json_data.spec and
                               json_data.spec.token then

                                local token = json_data.spec.token
                                if string.sub(token, 1, 7) == "sha256~" then
                                    upstream = "oauth_api_backend"
                                    target_path = ngx.var.uri
                                    host_header = healthy_api_host
                                    ngx.log(ngx.INFO, "TokenReview with oauth token - routing to oauth_api_backend" .. ngx.var.uri)
                                else
                                    upstream = "oidc_api_backend"
                                    target_path = "/validate-token"
                                    host_header = primary_oidc_host  -- OIDC doesn't have failover yet
                                    ngx.log(ngx.INFO, "TokenReview with oidc token - routing to oidc_api_backend/validate-token")
                                end
                            else
                                -- Not a TokenReview or missing token - use oauth_api_backend
                                upstream = "oauth_api_backend"
                                target_path = ngx.var.uri
                                host_header = healthy_api_host
                                ngx.log(ngx.INFO, "Not a TokenReview request - routing to oauth_api_backend" .. ngx.var.uri)
                            end
                        else
                            -- Invalid JSON - use oauth_api_backend
                            upstream = "oauth_api_backend"
                            target_path = ngx.var.uri
                            host_header = healthy_api_host
                            ngx.log(ngx.INFO, "Not a JSON in request body - routing to oauth_api_backend" .. ngx.var.uri)
                        end
                    else
                        -- No body - use oauth_api_backend
                        upstream = "oauth_api_backend"
                        target_path = ngx.var.uri
                        host_header = healthy_api_host
                        ngx.log(ngx.INFO, "No request body - routing to oauth_api_backend" .. ngx.var.uri)
                    end

                    -- Set the chosen upstream based on the upstream type
                    if upstream == "oidc_api_backend" then
                        ngx.var.chosen_upstream = primary_oidc_host .. ":" .. primary_oidc_port
                    else
                        ngx.var.chosen_upstream = healthy_api_host .. ":" .. healthy_api_port
                    end

                    ngx.var.target_path = target_path
                    ngx.var.host_header = host_header
                }
                
                proxy_pass https://$chosen_upstream$target_path;
                proxy_ssl_server_name on;
                proxy_set_header Host $host_header;

                # Connection and timeout settings
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_send_timeout 30s;
            }

            location /nginx-health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
