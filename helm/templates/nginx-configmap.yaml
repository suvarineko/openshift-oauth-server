{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oauth-server.fullname" . }}-nginx-config
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /var/run/nginx.pid;
    error_log /dev/stderr notice;
    events {
        worker_connections 1024;
    }
    http {
        client_body_temp_path /tmp/nginx_client_temp;
        proxy_temp_path /tmp/nginx_proxy_temp;
        fastcgi_temp_path /tmp/nginx_fastcgi_temp;
        uwsgi_temp_path /tmp/nginx_uwsgi_temp;
        scgi_temp_path /tmp/nginx_scgi_temp;
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'upstream_addr="$upstream_addr" upstream_status="$upstream_status"';
        access_log /dev/stdout main;
        upstream oauth_backend {
            server {{ .Values.proxy.upstreams.primary.oauth }}:{{ .Values.proxy.upstreams.primary.port }} fail_timeout=15s max_fails=3;
            server {{ .Values.proxy.upstreams.secondary.oauth }}:{{ .Values.proxy.upstreams.secondary.port }} backup;
        }

        upstream oidc_api_backend {
            server {{ .Values.proxy.upstreams.primary.oidc }}:{{ .Values.proxy.upstreams.primary.port }};
        }

        upstream oauth_api_backend {
            server {{ .Values.proxy.upstreams.primary.api }}:{{ .Values.proxy.upstreams.primary.port }} fail_timeout=15s max_fails=3;
            server {{ .Values.proxy.upstreams.secondary.api }}:{{ .Values.proxy.upstreams.secondary.port }} backup;
        }

        server {
            listen {{ .Values.proxy.port }} ssl;
            server_name {{ .Values.proxy.domain }};
            ssl_certificate /etc/tls/tls.crt;
            ssl_certificate_key /etc/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;
            
            # Declare variables for Lua script
            set $chosen_upstream "";
            set $target_path "";
            set $host_header "";

            location / {
                access_log /dev/stdout main;
                error_log /dev/stderr debug;
                
                # # Log the original request details
                # access_by_lua_block {
                #     ngx.log(ngx.INFO, "OAuth request: " .. ngx.var.request_method .. " " .. ngx.var.request_uri)
                #     ngx.log(ngx.INFO, "Original Host: " .. (ngx.var.http_host or "none"))
                #     ngx.log(ngx.INFO, "Proxy Host will be: {{ .Values.proxy.upstreams.primary.oauth }}")
                #     ngx.log(ngx.INFO, "User-Agent: " .. (ngx.var.http_user_agent or "none"))
                #     if ngx.var.args then
                #         ngx.log(ngx.INFO, "Query params: " .. ngx.var.args)
                #     end
                    
                #     -- Log all headers for debugging
                #     local h = ngx.req.get_headers()
                #     for k, v in pairs(h) do
                #         if k:lower() == "authorization" or k:lower() == "cookie" then
                #             ngx.log(ngx.INFO, "Header " .. k .. ": [REDACTED]")
                #         else
                #             ngx.log(ngx.INFO, "Header " .. k .. ": " .. tostring(v))
                #         end
                #     end
                # }
                
                proxy_pass https://oauth_backend;
                proxy_ssl_server_name on;
                proxy_set_header Host {{ .Values.proxy.upstreams.primary.oauth }};
                
                # # Additional headers for better upstream compatibility
                # proxy_set_header X-Real-IP $remote_addr;
                # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                # proxy_set_header X-Forwarded-Proto $scheme;
                # proxy_set_header X-Forwarded-Host $host;
                # proxy_set_header Upgrade $http_upgrade;
                # proxy_set_header Connection "upgrade";
                
                # # Enhanced error handling - include 400 Bad Request
                # proxy_intercept_errors on;
                # error_page 400 404 500 502 503 504;
            }

            location /apis {
                access_by_lua_block {
                    local cjson = require "cjson"
                    local upstream = "oauth_api_backend"
                    local target_path = ngx.var.uri
                    local host_header = "{{ .Values.proxy.upstreams.primary.api }}"
                    
                    -- Read request body
                    ngx.req.read_body()
                    local body = ngx.req.get_body_data()
                    
                    if body then
                        local success, json_data = pcall(cjson.decode, body)
                        if success and json_data then
                            -- Check if it's a TokenReview request
                            if json_data.kind == "TokenReview" and 
                               json_data.spec and 
                               json_data.spec.token then
                                
                                local token = json_data.spec.token
                                if string.sub(token, 1, 7) == "sha256~" then
                                    upstream = "oauth_api_backend"
                                    target_path = ngx.var.uri
                                    host_header = "{{ .Values.proxy.upstreams.primary.api }}"
                                    ngx.log(ngx.INFO, "TokenReview with oauth token - routing to oauth_api_backend" .. ngx.var.uri)
                                else
                                    upstream = "oidc_api_backend"
                                    target_path = "/validate-token"
                                    host_header = "{{ .Values.proxy.upstreams.primary.oidc }}"
                                    ngx.log(ngx.INFO, "TokenReview with oidc token - routing to oidc_api_backend/validate-token")
                                end
                            else
                                -- Not a TokenReview or missing token - use oauth_api_backend
                                upstream = "oauth_api_backend"
                                target_path = ngx.var.uri
                                host_header = "{{ .Values.proxy.upstreams.primary.api }}"
                                ngx.log(ngx.INFO, "Not a TokenReview request - routing to oauth_api_backend" .. ngx.var.uri)
                            end
                        else
                            -- Invalid JSON - use oauth_api_backend
                            upstream = "oauth_api_backend"
                            target_path = ngx.var.uri
                            host_header = "{{ .Values.proxy.upstreams.primary.api }}"
                            ngx.log(ngx.INFO, "Not a JSON in request body - routing to oauth_api_backend" .. ngx.var.uri)
                        end
                    else
                        -- No body - use oauth_api_backend
                        upstream = "oauth_api_backend"
                        target_path = ngx.var.uri
                        host_header = "{{ .Values.proxy.upstreams.primary.api }}"
                        ngx.log(ngx.INFO, "No request body - routing to oauth_api_backend" .. ngx.var.uri)
                    end
                    
                    ngx.var.chosen_upstream = upstream
                    ngx.var.target_path = target_path
                    ngx.var.host_header = host_header
                }
                
                proxy_pass https://$chosen_upstream$target_path;
                proxy_ssl_server_name on;
                proxy_set_header Host $host_header;
                # proxy_set_header Upgrade $http_upgrade;
                # proxy_set_header Connection "upgrade";
            }

            location /nginx-health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
