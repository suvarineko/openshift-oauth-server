{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oauth-server.fullname" . }}-nginx-proxy
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
    component: nginx-proxy
spec:
  selector:
    matchLabels:
      component: nginx-proxy
  template:
    metadata:
      labels:
        component: nginx-proxy
      annotations:
        # Add checksum annotation to force deployment rollout when ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "oauth-server.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      nodeSelector:
        {{- toYaml .Values.proxy.nodeSelector | nindent 8 }}
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: create-dirs
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              # Create temp directories
              mkdir -p /tmp/nginx_client_temp /tmp/nginx_proxy_temp /tmp/nginx_fastcgi_temp /tmp/nginx_uwsgi_temp /tmp/nginx_scgi_temp
              chown -R 101:101 /tmp/nginx_*
              chmod -R 755 /tmp/nginx_*
              
              # Create OpenResty default directories
              # mkdir -p /var/run/openresty
              # chown -R 101:101 /var/run/openresty
              # chmod -R 755 /var/run/openresty
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-var-run
              mountPath: /var/run
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
      containers:
        - name: nginx
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["openresty"]
          args:
            - -c
            - /etc/nginx/nginx.conf
            - -g
            - "daemon off;"
            {{- if .Values.proxy.args }}
            {{- range .Values.proxy.args }}
            - {{ . }}
            {{- end }}
            {{- end }}
          {{- if .Values.proxy.env }}
          env:
            {{- toYaml .Values.proxy.env | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.proxy.port }}
              protocol: TCP
              hostPort: {{ .Values.proxy.port }}
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: {{ .Values.proxy.port }}
              scheme: HTTPS
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: {{ .Values.proxy.port }}
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-var-run
              mountPath: /var/run
            - name: nginx-var-cache
              mountPath: /var/cache/nginx
            - name: nginx-var-log
              mountPath: /var/log/nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # add:
              #   - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "oauth-server.fullname" . }}-nginx-config
            defaultMode: 0644
        - name: tls-certs
          secret:
            secretName: {{ (index .Values.ingress.tls 0).secretName }}
            defaultMode: 0644
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-var-run
          emptyDir: {}
        - name: nginx-var-cache
          emptyDir: {}
        - name: nginx-var-log
          emptyDir: {}
{{- end }}
