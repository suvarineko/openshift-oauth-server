apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oauth-server.fullname" . }}
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthaccesstokens", "oauthauthorizetokens", "oauthclients"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["user.openshift.io"]
    resources: ["identities", "users", "groups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oauth-server.fullname" . }}-discovery
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/.well-known/openid-configuration", "/.well-known/oauth-authorization-server", "/.well-known/jwks.json"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oauth-server.fullname" . }}
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oauth-server.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oauth-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oauth-server.fullname" . }}-discovery-anonymous
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oauth-server.fullname" . }}-discovery
subjects:
  - kind: User
    name: system:anonymous
    apiGroup: rbac.authorization.k8s.io
