{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oauth-server.fullname" . }}-nginx-config
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /var/run/nginx.pid;
    error_log /dev/stderr notice;
    events {
        worker_connections 1024;
    }
    http {
        resolver 169.254.20.10;
        client_body_temp_path /tmp/nginx_client_temp;
        proxy_temp_path /tmp/nginx_proxy_temp;
        fastcgi_temp_path /tmp/nginx_fastcgi_temp;
        uwsgi_temp_path /tmp/nginx_uwsgi_temp;
        scgi_temp_path /tmp/nginx_scgi_temp;
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'upstream_addr="$upstream_addr" upstream_status="$upstream_status"';
        access_log /dev/stdout main;
        upstream oauth_backend {
            server {{ .Values.proxy.upstreams.primary.oauth }}:{{ .Values.proxy.upstreams.primary.port }} fail_timeout=15s max_fails=3;
            server {{ .Values.proxy.upstreams.secondary.oauth }}:{{ .Values.proxy.upstreams.secondary.port }} backup;
        }

        upstream oidc_api_backend {
            server {{ .Values.proxy.upstreams.primary.oidc }}:{{ .Values.proxy.upstreams.primary.port }};
        }

        upstream oauth_api_backend {
            server {{ .Values.proxy.upstreams.primary.api }}:{{ .Values.proxy.upstreams.primary.port }} fail_timeout=15s max_fails=3;
            server {{ .Values.proxy.upstreams.secondary.api }}:{{ .Values.proxy.upstreams.secondary.port }} backup;
        }

        server {
            listen {{ .Values.proxy.port }} ssl;
            server_name {{ .Values.proxy.domain }};
            ssl_certificate /etc/tls/tls.crt;
            ssl_certificate_key /etc/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;
            
            # Declare variables for Lua script
            set $chosen_upstream "";
            set $target_path "";
            set $host_header "";
            set $primary_healthy "";
            set $secondary_healthy "";

            location / {
                access_log /dev/stdout main;
                error_log /dev/stderr debug;

                access_by_lua_block {
                    local http = require "resty.http"
                    local httpc = http.new()

                    local primary_oauth_host = "{{ .Values.proxy.upstreams.primary.oauth }}"
                    local primary_api_host = "{{ .Values.proxy.upstreams.primary.api }}"
                    local primary_port = "{{ .Values.proxy.upstreams.primary.port }}"
                    local secondary_oauth_host = "{{ .Values.proxy.upstreams.secondary.oauth }}"
                    local secondary_api_host = "{{ .Values.proxy.upstreams.secondary.api }}"
                    local secondary_port = "{{ .Values.proxy.upstreams.secondary.port }}"

                    local chosen_upstream = ""
                    local chosen_host = ""

                    -- Check primary upstream health (both OAuth and API must be healthy)
                    ngx.log(ngx.INFO, "Checking primary upstream health...")

                    local primary_oauth_res, primary_oauth_err = httpc:request_uri("https://" .. primary_oauth_host .. ":" .. primary_port .. "/healthz", {
                        method = "GET",
                        timeout = 3000,
                        ssl_verify = false
                    })

                    local primary_api_res, primary_api_err = httpc:request_uri("https://" .. primary_api_host .. ":" .. primary_port .. "/healthz", {
                        method = "GET",
                        timeout = 3000,
                        ssl_verify = false
                    })

                    local primary_oauth_healthy = primary_oauth_res and primary_oauth_res.status == 200 and primary_oauth_res.body and string.match(primary_oauth_res.body, "ok")
                    local primary_api_healthy = primary_api_res and primary_api_res.status == 200 and primary_api_res.body and string.match(primary_api_res.body, "ok")
                    local primary_healthy = primary_oauth_healthy and primary_api_healthy

                    if primary_healthy then
                        chosen_upstream = primary_oauth_host .. ":" .. primary_port
                        chosen_host = primary_oauth_host
                        ngx.log(ngx.INFO, "Primary upstream is healthy (OAuth + API), using: " .. chosen_upstream)
                    else
                        ngx.log(ngx.WARN, "Primary upstream unhealthy - OAuth: " .. tostring(primary_oauth_healthy) .. ", API: " .. tostring(primary_api_healthy))

                        -- Check secondary upstream health (both OAuth and API must be healthy)
                        ngx.log(ngx.INFO, "Checking secondary upstream health...")

                        local secondary_oauth_res, secondary_oauth_err = httpc:request_uri("https://" .. secondary_oauth_host .. ":" .. secondary_port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        local secondary_api_res, secondary_api_err = httpc:request_uri("https://" .. secondary_api_host .. ":" .. secondary_port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        local secondary_oauth_healthy = secondary_oauth_res and secondary_oauth_res.status == 200 and secondary_oauth_res.body and string.match(secondary_oauth_res.body, "ok")
                        local secondary_api_healthy = secondary_api_res and secondary_api_res.status == 200 and secondary_api_res.body and string.match(secondary_api_res.body, "ok")
                        local secondary_healthy = secondary_oauth_healthy and secondary_api_healthy

                        if secondary_healthy then
                            chosen_upstream = secondary_oauth_host .. ":" .. secondary_port
                            chosen_host = secondary_oauth_host
                            ngx.log(ngx.INFO, "Secondary upstream is healthy (OAuth + API), using: " .. chosen_upstream)
                        else
                            ngx.log(ngx.ERR, "Both upstreams unhealthy - Secondary OAuth: " .. tostring(secondary_oauth_healthy) .. ", API: " .. tostring(secondary_api_healthy) .. " - falling back to secondary")
                            chosen_upstream = secondary_oauth_host .. ":" .. secondary_port
                            chosen_host = secondary_oauth_host
                        end
                    end

                    ngx.var.chosen_upstream = chosen_upstream
                    ngx.var.host_header = chosen_host
                }

                proxy_pass https://$chosen_upstream;
                proxy_ssl_server_name on;
                proxy_set_header Host $host_header;

                # Connection and timeout settings
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_send_timeout 30s;
            }

            location /apis {
                access_by_lua_block {
                    local cjson = require "cjson"
                    local http = require "resty.http"
                    local httpc = http.new()

                    -- Health check first to determine healthy upstreams (both OAuth and API must be healthy)
                    local primary_oauth_host = "{{ .Values.proxy.upstreams.primary.oauth }}"
                    local primary_api_host = "{{ .Values.proxy.upstreams.primary.api }}"
                    local primary_port = "{{ .Values.proxy.upstreams.primary.port }}"
                    local secondary_oauth_host = "{{ .Values.proxy.upstreams.secondary.oauth }}"
                    local secondary_api_host = "{{ .Values.proxy.upstreams.secondary.api }}"
                    local secondary_port = "{{ .Values.proxy.upstreams.secondary.port }}"
                    local primary_oidc_host = "{{ .Values.proxy.upstreams.primary.oidc }}"
                    local primary_oidc_port = "{{ .Values.proxy.upstreams.primary.port }}"

                    -- Determine healthy upstream backend
                    local healthy_api_host = ""
                    local healthy_api_port = ""

                    -- Check primary upstream health (both OAuth and API must be healthy)
                    ngx.log(ngx.INFO, "Checking primary upstream health for APIs...")

                    local primary_oauth_res, primary_oauth_err = httpc:request_uri("https://" .. primary_oauth_host .. ":" .. primary_port .. "/healthz", {
                        method = "GET",
                        timeout = 3000,
                        ssl_verify = false
                    })

                    local primary_api_res, primary_api_err = httpc:request_uri("https://" .. primary_api_host .. ":" .. primary_port .. "/healthz", {
                        method = "GET",
                        timeout = 3000,
                        ssl_verify = false
                    })

                    local primary_oauth_healthy = primary_oauth_res and primary_oauth_res.status == 200 and primary_oauth_res.body and string.match(primary_oauth_res.body, "ok")
                    local primary_api_healthy = primary_api_res and primary_api_res.status == 200 and primary_api_res.body and string.match(primary_api_res.body, "ok")
                    local primary_healthy = primary_oauth_healthy and primary_api_healthy

                    if primary_healthy then
                        healthy_api_host = primary_api_host
                        healthy_api_port = primary_port
                        ngx.log(ngx.INFO, "Primary upstream is healthy (OAuth + API), using API: " .. healthy_api_host)
                    else
                        ngx.log(ngx.WARN, "Primary upstream unhealthy - OAuth: " .. tostring(primary_oauth_healthy) .. ", API: " .. tostring(primary_api_healthy) .. ", checking secondary")

                        -- Check secondary upstream health (both OAuth and API must be healthy)
                        local secondary_oauth_res, secondary_oauth_err = httpc:request_uri("https://" .. secondary_oauth_host .. ":" .. secondary_port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        local secondary_api_res, secondary_api_err = httpc:request_uri("https://" .. secondary_api_host .. ":" .. secondary_port .. "/healthz", {
                            method = "GET",
                            timeout = 3000,
                            ssl_verify = false
                        })

                        local secondary_oauth_healthy = secondary_oauth_res and secondary_oauth_res.status == 200 and secondary_oauth_res.body and string.match(secondary_oauth_res.body, "ok")
                        local secondary_api_healthy = secondary_api_res and secondary_api_res.status == 200 and secondary_api_res.body and string.match(secondary_api_res.body, "ok")
                        local secondary_healthy = secondary_oauth_healthy and secondary_api_healthy

                        if secondary_healthy then
                            healthy_api_host = secondary_api_host
                            healthy_api_port = secondary_port
                            ngx.log(ngx.INFO, "Secondary upstream is healthy (OAuth + API), using API: " .. healthy_api_host)
                        else
                            ngx.log(ngx.ERR, "Both upstreams unhealthy - Secondary OAuth: " .. tostring(secondary_oauth_healthy) .. ", API: " .. tostring(secondary_api_healthy) .. " - using secondary")
                            healthy_api_host = secondary_api_host
                            healthy_api_port = secondary_port
                        end
                    end

                    -- Now use the original logic with healthy hosts
                    local upstream = "oauth_api_backend"
                    local target_path = ngx.var.uri
                    local host_header = healthy_api_host

                    -- Read request body
                    ngx.req.read_body()
                    local body = ngx.req.get_body_data()

                    if body then
                        local success, json_data = pcall(cjson.decode, body)
                        if success and json_data then
                            -- Check if it's a TokenReview request
                            if json_data.kind == "TokenReview" and
                               json_data.spec and
                               json_data.spec.token then

                                local token = json_data.spec.token
                                if string.sub(token, 1, 7) == "sha256~" then
                                    upstream = "oauth_api_backend"
                                    target_path = ngx.var.uri
                                    host_header = healthy_api_host
                                    ngx.log(ngx.INFO, "TokenReview with oauth token - routing to oauth_api_backend" .. ngx.var.uri)
                                else
                                    upstream = "oidc_api_backend"
                                    target_path = "/validate-token"
                                    host_header = primary_oidc_host  -- OIDC doesn't have failover yet
                                    ngx.log(ngx.INFO, "TokenReview with oidc token - routing to oidc_api_backend/validate-token")
                                end
                            else
                                -- Not a TokenReview or missing token - use oauth_api_backend
                                upstream = "oauth_api_backend"
                                target_path = ngx.var.uri
                                host_header = healthy_api_host
                                ngx.log(ngx.INFO, "Not a TokenReview request - routing to oauth_api_backend" .. ngx.var.uri)
                            end
                        else
                            -- Invalid JSON - use oauth_api_backend
                            upstream = "oauth_api_backend"
                            target_path = ngx.var.uri
                            host_header = healthy_api_host
                            ngx.log(ngx.INFO, "Not a JSON in request body - routing to oauth_api_backend" .. ngx.var.uri)
                        end
                    else
                        -- No body - use oauth_api_backend
                        upstream = "oauth_api_backend"
                        target_path = ngx.var.uri
                        host_header = healthy_api_host
                        ngx.log(ngx.INFO, "No request body - routing to oauth_api_backend" .. ngx.var.uri)
                    end

                    -- Set the chosen upstream based on the upstream type
                    if upstream == "oidc_api_backend" then
                        ngx.var.chosen_upstream = primary_oidc_host .. ":" .. primary_oidc_port
                    else
                        ngx.var.chosen_upstream = healthy_api_host .. ":" .. healthy_api_port
                    end

                    ngx.var.target_path = target_path
                    ngx.var.host_header = host_header
                }
                
                proxy_pass https://$chosen_upstream$target_path;
                proxy_ssl_server_name on;
                proxy_set_header Host $host_header;

                # Connection and timeout settings
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_send_timeout 30s;
            }

            location /nginx-health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
