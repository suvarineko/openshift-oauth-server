{{- if .Values.proxy.enabled -}}
{{- $fullName := include "oauth-server.fullname" . -}}
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: proxy-auth
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
  {{- with .Values.proxy.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.proxy.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-proxy
                port:
                  number: 8080
{{- end }}
