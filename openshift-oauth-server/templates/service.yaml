apiVersion: v1
kind: Service
metadata:
  name: oauth-console
  labels:
    {{- include "oauth-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
    - port: 9393
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "oauth-server.selectorLabels" . | nindent 4 }}
