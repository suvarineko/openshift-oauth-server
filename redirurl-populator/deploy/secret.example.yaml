# ---------------------------------------------------------------------------
# Apply on the SPOKE cluster (where the populator runs). Holds the credentials
# for the CENTRAL cluster. Retrieve the token created by rbac-central-cluster.yaml
# on the central cluster with:
#
#   oc -n redirurl-populator get secret redirurl-populator-token \
#     -o jsonpath='{.data.token}' | base64 -d
#
# Never commit a real token to git.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redirurl-populator-remote
  namespace: redirurl-populator
type: Opaque
stringData:
  KUBE_TOKEN: "REPLACE_WITH_CENTRAL_SA_TOKEN"
  # Optional: to verify the central cluster's serving certificate instead of
  # skipping verification, set KUBE_INSECURE_SKIP_TLS_VERIFY=false in the
  # ConfigMap and provide the CA bundle here (PEM):
  # KUBE_CA_CERT: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
